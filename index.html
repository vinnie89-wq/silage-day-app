<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pembrokeshire Silage Day 2027</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="shared.js"></script>
<style>
:root{--green:#2c4a1c;--green2:#3f6b25;--grass:#7fa83a;--light:#f1edd8;--paper:#fbf8ee;--brown:#3a2614;--cream:#f6efcf;--ink:#2a1e12;--muted:#6b6250;--line:#e2dcc4;--yellow:#f5c518;--red:#c8202a;--amber:#e08a00;--live:#19a34a;--loud:#d9480f;--quiet:#2a6fb0;--fs:16px;--font:Barlow,system-ui,sans-serif;--head:"Barlow Condensed",Barlow,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:var(--fs)}
h1,h2,h3,.cond{font-family:var(--head)}
button{font:inherit;cursor:pointer}
/* calm + easy-read */
body.calm{--red:#a5524f;--amber:#b98a3e;--live:#4f8a5f;--yellow:#e8d48a;--loud:#a8674a}
body.calm *,body.calm *::before,body.calm *::after{animation:none!important;transition:none!important}
body.easy{--fs:18px;--font:"Atkinson Hyperlegible",Verdana,sans-serif;--head:"Atkinson Hyperlegible",Verdana,sans-serif;letter-spacing:.02em;line-height:1.55}
body.easy h2,body.easy h3,body.easy .sec{letter-spacing:0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--paper);padding-bottom:84px}
header{background:var(--cream);border-bottom:3px solid var(--brown);padding:8px 12px 10px;position:sticky;top:0;z-index:20}
.hrow{display:flex;align-items:center;gap:10px}
.hlogo{height:58px}
.hdate{font:700 13px var(--head);color:var(--green);text-transform:uppercase;letter-spacing:.4px;line-height:1.25}
.hdate span{color:var(--brown)}
.hbtns{margin-left:auto;display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.hb{border:0;border-radius:8px;padding:5px 9px;font-weight:700;font-size:12.5px;background:var(--green);color:var(--cream);white-space:nowrap}
.hb.alt{background:#fff;color:var(--green);border:1px solid var(--line)}
.hb.on{background:var(--quiet);color:#fff}
.proto{display:flex;align-items:center;gap:8px;margin-top:7px;background:var(--green);color:var(--cream);border-radius:9px;padding:5px 10px;font-size:11.5px}
.proto b{font:700 17px var(--head);min-width:42px}
.proto input{flex:1;accent-color:var(--yellow)}
.banner{background:var(--yellow);color:#2a2400;padding:8px 14px;font-weight:600;font-size:14px}
main{padding:0}
.view{display:none}.view.on{display:block}
.pad{padding:12px 16px}
.sec{font:700 23px var(--head);margin:4px 0 10px}
.note{font-size:12.5px;color:var(--muted);background:var(--light);border-radius:8px;padding:8px 10px;margin:10px 0}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 16px 14px}
.card h3{margin:0 0 8px;font-size:21px;color:var(--green)}
.btn{display:block;width:100%;border:0;border-radius:10px;background:var(--green);color:#fff;font-weight:700;padding:12px;font-size:15px;margin-top:10px;text-align:center;text-decoration:none}
.btn.alt{background:var(--light);color:var(--green)}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 16px 10px}
.chips::-webkit-scrollbar{display:none}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.3px}
.p-live{background:#dcf5e3;color:#11713a}.p-soon{background:#fff0d6;color:#8a5300}.p-next{background:var(--light);color:var(--muted)}.p-done{background:#eee;color:#777}.p-bad{background:#fde2e2;color:#a01919}.p-loud{background:#fde7dc;color:#9a3a10}.p-quiet{background:#e3eefa;color:#1d5590}
.prog{height:5px;background:#e4ebe0;border-radius:3px;margin-top:7px;overflow:hidden}.prog span{display:block;height:100%;background:var(--live)}
.fieldtag{display:inline-block;background:var(--red);color:#fff;border-radius:999px;font:700 12px var(--font);padding:1px 7px;margin-right:4px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center}
nav .in{display:flex;width:100%;max-width:560px}
nav button{flex:1;border:0;background:none;padding:8px 0 12px;color:var(--muted);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:20px;line-height:1.1}
nav button.on{color:var(--green)}
body.easy nav button{font-size:11.5px}
/* news */
.count{margin:4px 16px 14px;background:var(--green);color:var(--cream);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:14px}
.count b{font:800 44px var(--head);line-height:1;color:var(--yellow)}
.post{margin:0 16px 14px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.post video,.post img{display:block;width:100%;max-height:70vh;background:#000;object-fit:contain}
.post .pb{padding:12px 14px}
.post .pd{font-size:12px;font-weight:700;color:var(--grass);text-transform:uppercase}
.post h3{margin:3px 0 6px;font-size:22px}
.post p{margin:0 0 6px}
.expect{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.expect:last-child{border-bottom:0}
.expect .n{flex:none;width:40px;height:40px;border-radius:12px;background:var(--light);display:grid;place-items:center;font-size:22px}
.expect b{display:block}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 14px}
.scard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;color:inherit}
.slogo{height:58px;display:flex;align-items:center;justify-content:center;margin-bottom:6px;border-radius:8px;overflow:hidden}
.slogo img{max-height:58px;max-width:100%}
/* map */
.mapctl{display:flex;gap:7px;padding:10px 16px;align-items:center;flex-wrap:wrap}
.zoom{margin-left:auto;display:flex;gap:6px}
.zoom button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:19px;font-weight:700}
.mapwrap{position:relative;overflow:hidden;touch-action:none;height:min(calc(100vh - 340px),calc(min(100vw,560px)*1.4708));min-height:300px;background:#2b3b26;cursor:grab}
.mapinner{position:absolute;left:0;top:0;width:100%;transform-origin:0 0;--inv:1}
.mapinner.anim{transition:transform .25s ease}
.mapinner img.base{display:block;width:100%;user-select:none;-webkit-user-drag:none}
body.calm .mapinner img.base{filter:saturate(.55) brightness(1.05)}
.pin{position:absolute;transform:translate(-50%,-50%);border:0;background:transparent;padding:0;width:13%;aspect-ratio:1;border-radius:50%}
.pin .ring{position:absolute;inset:6%;border-radius:50%;border:3px solid transparent}
.pin.live .ring{border-color:var(--live);animation:pulse 1.6s infinite}
.pin.soon .ring{border-color:var(--amber);border-style:dashed}
.pin .badge{position:absolute;left:50%;top:-6%;transform:translate(-50%,-100%) scale(var(--inv));transform-origin:50% 100%;background:var(--live);color:#fff;font:700 10px var(--font);padding:2px 6px;border-radius:5px;white-space:nowrap;pointer-events:none}
.pin.soon .badge{background:var(--amber)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(25,163,74,.75)}70%{box-shadow:0 0 0 12px rgba(25,163,74,0)}100%{box-shadow:0 0 0 0 rgba(25,163,74,0)}}
.amen{position:absolute;transform:translate(-50%,-50%) scale(var(--inv));width:30px;height:30px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;font-size:15px;box-shadow:0 2px 6px rgba(0,0,0,.4);padding:0}
.amen.hide{display:none}
.zone{position:absolute;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none}
.zone.loud{background:radial-gradient(circle,rgba(217,72,15,.45),rgba(217,72,15,.12) 65%,transparent 72%)}
.zone.quiet{background:radial-gradient(circle,rgba(42,111,176,.6),rgba(42,111,176,.25) 60%,transparent 72%);border:2px dashed rgba(42,111,176,.8)}
.me{position:absolute;transform:translate(-50%,-50%) scale(var(--inv));width:20px;height:20px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,.25)}
.maphint{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;font-size:11.5px;padding:4px 8px;border-radius:6px;pointer-events:none}
.legend{display:flex;gap:12px;padding:8px 16px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-2px;margin-right:5px}
/* lists */
.item{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:#fff;width:100%;text-align:left;border-left:0;border-right:0;border-top:0;color:inherit}
.item .t{min-width:56px;font:700 18px var(--head);color:var(--green)}
.item .t small{display:block;font:500 12px var(--font);color:var(--muted)}
.item .b{flex:1}
.item .ttl{font-weight:700}
.item .meta{font-size:13px;color:var(--muted);margin-top:2px}
.item.done{opacity:.5}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.mcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:0;overflow:hidden;text-align:left;color:inherit}
.mimg{height:84px;display:grid;place-items:center;background:linear-gradient(135deg,var(--green2),var(--grass));font-size:38px}
.mcard .mb{padding:9px 10px 11px}
.mcard .mn{font-weight:700;line-height:1.15}
.mcard .mt{font-size:12.5px;color:var(--muted);margin-top:2px}
.search{width:calc(100% - 32px);margin:0 16px 12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:12px 16px}
.pgrid figure{margin:0;position:relative;aspect-ratio:1;overflow:hidden;border-radius:6px;background:#dfe7da;display:grid;place-items:center;font-size:26px}
.pgrid img{width:100%;height:100%;object-fit:cover}
.upl{display:block;border:2px dashed var(--grass);border-radius:14px;padding:20px;text-align:center;color:var(--green);font-weight:700;background:var(--light);margin:0 16px}
.upl input{display:none}
.ticket{margin:4px 16px;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.12);border:1px solid var(--line)}
.ticket .top{background:var(--cream);text-align:center;padding:14px;border-bottom:3px solid var(--brown)}
.ticket .top img{width:70%;max-width:280px}
.ticket .mid{padding:18px;display:flex;flex-direction:column;align-items:center}
#qr{background:#fff;padding:10px;min-height:200px;min-width:200px;display:grid;place-items:center}
.tinfo{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 18px 18px;font-size:14px;border-top:2px dashed var(--line)}
.tinfo span{display:block;color:var(--muted);font-size:12px}
/* tickets */
.tix{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 16px 14px}
.tix::-webkit-scrollbar{height:6px}.tix::-webkit-scrollbar-thumb{background:#d9d0b2;border-radius:3px}
.tk{flex:0 0 86%;scroll-snap-align:center;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.1);border:1px solid var(--line)}
.tk .top{background:var(--cream);text-align:center;padding:10px;border-bottom:3px solid var(--brown)}
.tk .top img{width:52%;max-width:200px}
.tk .ty{font:800 22px var(--head);color:var(--green)}
.tk .mid{padding:14px;display:flex;flex-direction:column;align-items:center;min-height:250px;justify-content:center;text-align:center}
.qrbox{background:#fff;padding:8px;display:grid;place-items:center;min-height:176px;min-width:176px}
.tk .state{font-size:15px;font-weight:700;margin:8px 0}
.tk .acts{display:flex;gap:8px;padding:0 14px 14px}
.tk .acts button{flex:1;margin:0;padding:9px;font-size:13.5px}
.osum{margin:0 16px 12px;background:var(--green);color:var(--cream);border-radius:14px;padding:12px 14px}
.osum b{color:var(--yellow);font:800 22px var(--head)}
.lostbtn{display:flex;align-items:center;gap:10px;width:calc(100% - 32px);margin:0 16px 14px;border:0;border-radius:12px;background:#b3261e;color:#fff;font-weight:700;padding:12px 14px;font-size:15px;text-align:left}
body.calm .lostbtn{background:#8a4a46}
.lostbtn span{font-size:24px}
.step{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.step b.n{flex:none;width:28px;height:28px;border-radius:50%;background:#b3261e;color:#fff;display:grid;place-items:center}
.btn.red{background:#b3261e}
.sigbox{position:relative;background:#fff;border:2px dashed #b9ae86;border-radius:12px;margin-top:6px;height:160px;touch-action:none}
.sigbox.bad{border-color:var(--red)}.sigbox canvas{width:100%;height:100%;display:block}
.sigbox .ph{position:absolute;left:14px;bottom:10px;color:#b9ae86;pointer-events:none}
.sigbox .cl{position:absolute;right:8px;top:8px;border:0;background:var(--light);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:700;color:var(--green)}
select.fi{padding:9px 8px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,10,.45);z-index:40;display:none}.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:#fff;border-radius:18px 18px 0 0;max-height:85vh;overflow:auto;transform:translateY(105%);visibility:hidden;transition:transform .25s,visibility .25s;max-width:560px;margin:0 auto;padding:10px 18px 26px}
.sheet.on{transform:none;visibility:visible}
.sheet h2{margin:0 0 2px;font-size:25px}
.kind{color:var(--muted);font-size:14px;margin-bottom:10px}
.close{position:absolute;right:14px;top:12px;border:0;background:var(--light);width:34px;height:34px;border-radius:50%;font-size:18px}
.rules{counter-reset:r;padding:0;margin:0;list-style:none}
.rules li{position:relative;padding:9px 0 9px 40px;border-bottom:1px solid var(--line)}
.rules li::before{counter-increment:r;content:counter(r);position:absolute;left:0;top:8px;width:28px;height:28px;border-radius:50%;background:var(--yellow);font:800 15px var(--head);display:grid;place-items:center}
.chk{display:flex;gap:10px;align-items:flex-start;margin:14px 0 4px;font-weight:600}
.chk input{width:22px;height:22px;accent-color:var(--green);flex:none}
.langpick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.langpick button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:14px;font-weight:700;font-size:17px}
.langpick button.on{border-color:var(--green);background:var(--light)}
.toggle{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.toggle .b{flex:1}.toggle .b small{display:block;color:var(--muted);font-size:13px}
.sw{width:50px;height:28px;border-radius:999px;background:#ccc;border:0;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--green)}.sw.on::after{left:25px}
.toast{position:fixed;left:12px;right:12px;top:12px;z-index:60;max-width:536px;margin:0 auto;background:var(--brown);color:var(--cream);border-radius:14px;padding:12px 14px;display:none;font-size:14.5px}
.toast.on{display:block}
.toast b{color:var(--yellow);display:block;font-size:12px;text-transform:uppercase}
.cyflag{font-size:11.5px;color:var(--muted);text-align:center;padding:4px 16px 12px}
.fi{width:100%;border:1px solid #cfc7aa;border-radius:9px;padding:10px 11px;font:inherit;background:#fffdf6}
.fl{display:block;font-size:13px;font-weight:700;margin:10px 0 4px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="hrow">
      <img class="hlogo" src="logo.png" alt="Pembrokeshire Silage Day">
      <div class="hdate" id="hdate"></div>
      <div class="hbtns">
        <button class="hb" data-act="access" id="accBtn"></button>
        <button class="hb alt" data-act="safety" id="safeBtn"></button>
      </div>
    </div>
    <div class="proto"><span>Prototype time</span><b id="clock">11:30</b><input type="range" id="slider" min="540" max="1080" step="5" value="690" aria-label="Preview the day at a different time"></div>
  </header>
  <div class="banner" id="banner" style="display:none"></div>
  <main>
    <section class="view" id="v-news"></section>
    <section class="view" id="v-map">
      <div class="mapctl" id="mapctl"></div>
      <div class="mapwrap" id="mapwrap"><div class="mapinner" id="mapinner"><img class="base" src="map-2027.svg" alt=""></div><div class="maphint" id="maphint"></div></div>
      <div class="legend" id="legend"></div>
      <div id="nowList"></div>
    </section>
    <section class="view" id="v-sched"></section>
    <section class="view" id="v-mach"></section>
    <section class="view" id="v-photos"></section>
    <section class="view" id="v-ticket"></section>
  </main>
  <div class="cyflag" id="cyflag"></div>
  <nav><div class="in" id="nav"></div></nav>
</div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><button class="close" data-act="closeSheet" aria-label="Close">×</button><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

 tx=cw<=d.ww?(d.ww-cw)/2:Math.min(0,Math.max(d.ww-cw,tx));ty=ch<=d.wh?(d.wh-ch)/2:Math.min(0,Math.max(d.wh-ch,ty));

function setupSig(){const cv=$("#rgSig"),ctx=cv.getContext("2d");regHasInk=false;let d=false,last=null;
 const size=()=>{const r=cv.getBoundingClientRect(),dp=window.devicePixelRatio||1;cv.width=r.width*dp;cv.height=r.height*dp;ctx.setTransform(dp,0,0,dp,0,0);ctx.lineWidth=2.4;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#1b2419"};size();
 const pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
 cv.addEventListener("pointerdown",e=>{d=true;last=pos(e);try{cv.setPointerCapture(e.pointerId)}catch(x){}});
 cv.addEventListener("pointermove",e=>{if(!d)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;if(!regHasInk){regHasInk=true;$("#rgSigBox .ph").style.display="none";$("#rgSigBox").classList.remove("bad")}});
 ["pointerup","pointercancel","pointerleave"].forEach(ev=>cv.addEventListener(ev,()=>d=false));
 window.__rgClear=()=>{ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);size();regHasInk=false;$("#rgSigBox .ph").style.display=""};
 window.__rgImg=()=>{const s=document.createElement("canvas");s.width=360;s.height=110;const x=s.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,360,110);x.drawImage(cv,0,0,360,110);return s.toDataURL("image/jpeg",.6)};}

 rSigClear:()=>window.__rgClear&&window.__rgClear(),
 rSubmit:()=>{const ag=$("#rgAg").checked,kd=$("#rgKd").checked;$("#rgAgL").style.color=ag?"":"var(--red)";$("#rgKdL").style.color=kd?"":"var(--red)";$("#rgSigBox").classList.toggle("bad",!regHasInk);
   if(!ag||!kd||!regHasInk){$("#rgErr2").style.display="block";return}
   const g=gGet();let reg=draft.editing?g.signins.find(x=>x.code===MYREG):null;
   if(!reg){g.rseq++;const code="R-"+String(g.rseq).padStart(4,"0");reg={code,source:"app",status:"registered",members:[],pay:null,tickets:[]};g.signins.unshift(reg);MYREG=code;store.set("psd_myreg",code)}
   const keep=reg.members.filter(m=>m.paid);let n=Math.max(0,...reg.members.map(m=>+m.id.split("-").pop()||0));
   reg.members=draft.members.map(d=>{const old=d.id&&reg.members.find(m=>m.id===d.id);if(old)return{...old,name:d.name,type:old.paid?old.type:d.type};n++;return{id:`${reg.code}-${n}`,name:d.name,type:d.type,share:null,paid:null}});
   keep.forEach(k=>{if(!reg.members.find(m=>m.id===k.id))reg.members.push(k)});
   Object.assign(reg,{lang:lang||"en",name:draft.name,email:draft.email,mobile:draft.mobile,newsOptIn:$("#rgNews").checked,signature:window.__rgImg(),signedAt:new Date().toLocaleString("en-GB"),
     adults:reg.members.filter(m=>m.type==="adult").length,children:reg.members.filter(m=>m.type==="child").length,under5:reg.members.filter(m=>m.type==="under5").length});
   gSet(g);accepted=true;store.set("psd_safe2",true);regStep=0;draft=null;R.ticket();window.scrollTo(0,0);toast("✓",t("rDone"))},
 rCancelReg:()=>{openSheet(`<h2>${t("rCancelReg")}</h2><p>${t("rCancelQ")}</p><button class="btn red" data-act="rCancelYes">${t("rCancelYes")}</button><button class="btn alt" data-act="closeSheet">${t("rKeep")}</button>`)},
 rCancelYes:()=>{const g=gGet();const r=g.signins.find(x=>x.code===MYREG);if(r&&!r.members.some(m=>m.paid)){g.signins=g.signins.filter(x=>x.code!==MYREG)}else if(r){r.members=r.members.filter(m=>m.paid)}gSet(g);MYREG=null;store.set("psd_myreg",null);closeSheet(true);R.ticket()},
 rShare:el=>shareSheet(el.dataset.id),
 rShareGo:el=>{const nm=$("#shN").value.trim(),ct=$("#shC").value.trim();if(!nm){$("#shN").style.borderColor="var(--red)";return}if(!ct){$("#shC").style.borderColor="var(--red)";return}

   const link=location.href.split("#")[0]+"#t-"+el.dataset.id;openSheet(`<h2>📤 ${t("rSharedWith",{name:esc(nm)})}</h2><div class="kind">${t("trLink")}</div><input class="fi" readonly value="${esc(link)}" id="trL"><button class="btn" data-act="copyLink">${t("copy")}</button><button class="btn alt" data-act="openAs" data-c="${el.dataset.id}">${t("openAs",{name:esc(nm)})}</button><div class="note">${t("rShareNote")}</div>`)},
 rUnshare:el=>{const g=gGet();for(const r of g.signins){const m=(r.members||[]).find(y=>y.id===el.dataset.id);if(m)m.share=null}gSet(g);R.ticket()},
 lost:()=>lostSheet(),
 lostMap:()=>{closeSheet(true);go("map");setTimeout(()=>{amFilter="aid";R.map();focusPx(548,505)},150)},
 decl:()=>declSheet(),
 declSign:()=>{const nm=$("#dN").value.trim();let ok=true;["#dA","#dK"].forEach(x=>{const c=$(x);c.parentElement.style.color=c.checked?"":"var(--red)";if(!c.checked)ok=false});if(nm.length<3){$("#dN").style.borderColor="var(--red)";ok=false}if(!ok)return;
   ORDER.decl={name:nm,at:new Date().toLocaleString("en-GB")};saveOrder();accepted=true;store.set("psd_safe2",true);closeSheet(true);R.ticket()},
 transfer:el=>{const c=el.dataset.c;openSheet(`<h2>${t("trTitle")}</h2><div class="kind">${c}</div><p style="font-size:14px">${t("trSub")}</p><label class="fl">${t("trName")}</label><input class="fi" id="trN"><label class="fl">${t("trContact")}</label><input class="fi" id="trC"><button class="btn" data-act="trSend" data-c="${c}">${t("trSend")}</button>`)},
 trSend:el=>{const k=ORDER.tickets.find(x=>x.code===el.dataset.c),nm=$("#trN").value.trim(),ct=$("#trC").value.trim();if(!nm){$("#trN").style.borderColor="var(--red)";return}if(!ct){$("#trC").style.borderColor="var(--red)";return}
   k.transfer={name:nm,contact:ct,at:fmt(now)};saveOrder();R.ticket();const link=location.href.split("#")[0]+"#t-"+k.code;
   openSheet(`<h2>📤 ${t("withX",{name:esc(nm)})}</h2><div class="kind">${t("trLink")}</div><input class="fi" readonly value="${esc(link)}" id="trL"><button class="btn" data-act="copyLink">${t("copy")}</button><button class="btn alt" data-act="openAs" data-c="${k.code}">${t("openAs",{name:esc(nm)})}</button>`)},
 copyLink:async el=>{try{await navigator.clipboard.writeText($("#trL").value);el.textContent=t("copied")}catch(e){$("#trL").select()}},
 takeBack:el=>{const k=ORDER.tickets.find(x=>x.code===el.dataset.c);if(k.used)return;k.transfer=null;saveOrder();R.ticket()},
 scan:el=>{const k=ORDER.tickets.find(x=>x.code===el.dataset.c);let res,ok=false;
   if(!ORDER.decl)res=t("scanInactive");else if(k.used)res=t("scanUsed",{t:k.used});else{k.used=fmt(now);saveOrder();ok=true;res=t("scanOk",{type:tkType(k.type)})}
   R.ticket();openSheet(`<h2>${t("scanTitle")}</h2><div class="kind">${t("scanSub")}</div><div style="padding:18px;border-radius:12px;font-size:19px;font-weight:700;text-align:center;background:${ok?"#dcf5e3":"#fde2e2"};color:${ok?"#11713a":"#a01919"}">${res}</div><div class="cond" style="text-align:center;margin-top:8px">${k.code}</div>`)},
 scanGroup:()=>{let res,ok=false;if(!ORDER.decl)res=t("scanInactive");else{const ks=ORDER.tickets.filter(k=>!k.used&&!k.transfer);
   if(!ks.length)res=t("scanGroupNone");else{ks.forEach(k=>k.used=fmt(now));saveOrder();ok=true;const c={};ks.forEach(k=>c[k.type]=(c[k.type]||0)+1);res=t("scanGroupOk",{n:ks.length,list:Object.entries(c).map(([k,n])=>`${n} × ${tkType(k)}`).join(", ")})}}
   R.ticket();openSheet(`<h2>${t("scanTitle")}</h2><div class="kind">${t("scanSub")}</div><div style="padding:18px;border-radius:12px;font-size:18px;font-weight:700;text-align:center;background:${ok?"#dcf5e3":"#fde2e2"};color:${ok?"#11713a":"#a01919"}">${res}</div>${ORDER.tickets.some(k=>k.transfer&&!k.used)?`<div class="note">${ORDER.tickets.filter(k=>k.transfer&&!k.used).map(k=>`${k.code}: ${t("scanTransferred")}`).join("<br>")}</div>`:""}`)},
 openAs:el=>{closeSheet(true);location.hash="t-"+el.dataset.c},
 backAll:()=>{history.replaceState(null,"",location.pathname+location.search);R.ticket();window.scrollTo(0,0)},
 resetOrder:()=>{ORDER=JSON.parse(JSON.stringify(ORDER_DEFAULT));saveOrder();R.ticket()},

 closeSheet:()=>closeSheet(),closeSheetF:()=>closeSheet(true),
 access:()=>comfortSheet(),safety:()=>safetySheet(false),
 lang:el=>{const first=!lang;lang=el.dataset.l;store.set("psd_lang",lang);buildDemos();chrome();if(viewName)R[viewName]();if(first){closeSheet(true);if(!accepted)setTimeout(()=>safetySheet(true),150)}else comfortSheet()},
 acceptSafety:()=>{accepted=true;store.set("psd_safe2",true);closeSheet(true)},
 sw:el=>{const k=el.dataset.k;if(k==="calm"){calm=!calm;store.set("psd_calm",calm)}if(k==="easy"){easy=!easy;store.set("psd_easy",easy)}if(k==="sens"){sens=!sens;store.set("psd_sens",sens)}chrome();if(viewName)R[viewName]();comfortSheet()},
 amen:el=>{amFilter=el.dataset.k;R.map()},
 amenity:el=>{const a=AMEN[+el.dataset.i];openSheet(`<h2>${a.ic} ${esc(a[lang]||a.en)}</h2>`)},
 place:el=>{if(viewName!=="map"){closeSheet();go("map");setTimeout(()=>openPlace(el.dataset.id),120)}else openPlace(el.dataset.id)},
 machine:el=>openMachine(el.dataset.id),
 cat:el=>{schedCat=el.dataset.k;R.sched()},
 sponsor:el=>{const s=SPONSORS[+el.dataset.i];if(!s)return;const u=safeUrl(s.web);openSheet(`<div class="slogo" style="height:90px;background:${s.bg==="#000"?"#000":"#fff"}"><img src="${LOCAL_IMG(s.logo)?s.logo:""}" alt="" style="max-height:80px"></div><h2>${esc(s.n)}</h2><p>${esc(s[lang]||s.en)}</p>${(()=>{const os=P3.offers.filter(o=>o.spId===s.id&&o.status==="approved");return os.length?`<div style="font-weight:700;margin-top:8px">🏷️ ${t("offers")}</div>${os.map(o=>`<div style="background:var(--light);border-radius:10px;padding:9px 11px;margin-top:6px">${esc((lang==="cy"&&o.cy)||o.en)}</div>`).join("")}`:""})()}${u?`<a class="btn alt" href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\//,"").replace(/\/$/,""))}</a>`:""}`)},
 zin:()=>{const d=mapDims();zoomAt(zoom*1.6,d.ww/2,d.wh/2,true)},zout:()=>{const d=mapDims();zoomAt(zoom/1.6,d.ww/2,d.wh/2,true)},zreset:()=>{zoom=minZ();tx=0;ty=0;applyMap(true)},
 locate:()=>{try{if(!navigator.geolocation)throw 0;navigator.geolocation.getCurrentPosition(p=>{const px=geoToPx(p.coords.latitude,p.coords.longitude);
   if(px[0]<-50||px[0]>W+50||px[1]<-50||px[1]>H+50){const km=Math.round(Math.hypot((p.coords.latitude-51.807)*111,(p.coords.longitude+4.9966)*69)*10)/10;openSheet(`<h2>📍</h2><p>${t("locFar",{d:km})}</p>`);return}
   mePx=px;R.map();focusPx(px[0],px[1]);toast("📍",t("locHere"))},()=>openSheet(`<h2>📍</h2><p>${t("locNo")}</p>`),{enableHighAccuracy:true,timeout:8000})}catch(e){openSheet(`<h2>📍</h2><p>${t("locNo")}</p>`)}}
};
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el||!A[el.dataset.act])return;if(dragMoved>=6&&el.closest("#mapwrap"))return;e.preventDefault();A[el.dataset.act](el)});
$("#scrim").onclick=()=>closeSheet();

/* map gestures */
let dragMoved=0;
(function(){const wrap=$("#mapwrap"),pts=new Map();let st=null,lastTap=0;const rel=e=>{const b=wrap.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top}};
 wrap.addEventListener("pointerdown",e=>{pts.set(e.pointerId,rel(e));dragMoved=0;if(pts.size===1){const p=rel(e);st={x:p.x,y:p.y,tx,ty}}if(pts.size===2){const[a,b]=[...pts.values()];st={d:Math.hypot(a.x-b.x,a.y-b.y),z:zoom,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,tx,ty}}});
 window.addEventListener("pointermove",e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,rel(e));
  if(pts.size===1&&st&&st.d===undefined){const p=rel(e);dragMoved=Math.max(dragMoved,Math.hypot(p.x-st.x,p.y-st.y));tx=st.tx+p.x-st.x;ty=st.ty+p.y-st.y;applyMap()}
  else if(pts.size===2&&st&&st.d){const[a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;dragMoved=99;const nz=Math.max(minZ(),Math.min(5,st.z*d/st.d)),k=nz/st.z;tx=mx-(st.mx-st.tx)*k;ty=my-(st.my-st.ty)*k;zoom=nz;applyMap()}});
 const end=e=>{if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);if(pts.size===1){const p=[...pts.values()][0];st={x:p.x,y:p.y,tx,ty}}else if(!pts.size){if(dragMoved<6&&e.type==="pointerup"&&!e.target.closest("button")){const n=Date.now(),p=rel(e);if(n-lastTap<320){zoomAt(zoom*2,p.x,p.y,true);lastTap=0}else lastTap=n}st=null;setTimeout(()=>dragMoved=0,0)}};
 window.addEventListener("pointerup",end);window.addEventListener("pointercancel",end);
 wrap.addEventListener("wheel",e=>{e.preventDefault();const p=rel(e);zoomAt(zoom*Math.exp(-e.deltaY*.0015),p.x,p.y)},{passive:false});
 window.addEventListener("resize",()=>applyMap());})();

function exSheet(keep){if(!keep)exKeep={};const v=k=>esc(exKeep[k]||"");
 openSheet(`<h2>${t("exTitle")}</h2><p>${t("exIntro")}</p><label class="fl">${t("exBiz")} *</label><input class="fi" id="exB" value="${v("#exB")}"><label class="fl">${t("siName")} *</label><input class="fi" id="exN" autocomplete="name" value="${v("#exN")}"><label class="fl">${t("siPhone")} *</label><input class="fi" id="exP" type="tel" autocomplete="tel" value="${v("#exP")}"><label class="fl">${t("siEmail")} *</label><input class="fi" id="exE" type="email" autocomplete="email" value="${v("#exE")}">
 <div style="font-weight:700;margin-top:14px">${t("exMach")}</div>${exRows.map((r,i)=>`<div class="exrow" style="border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px"><label class="fl" style="margin-top:0">${t("exType")}</label><select class="fi">${TYPES.map(([ty])=>`<option ${ty===r.type?"selected":""}>${ty}</option>`).join("")}</select><div style="display:flex;gap:8px"><div style="flex:2"><label class="fl">${t("exMake")} *</label><input class="fi exm" value="${esc(r.make)}"></div><div style="flex:1"><label class="fl">${t("exYear")}</label><input class="fi exy" inputmode="numeric" maxlength="4" value="${esc(r.year)}"></div></div>${exRows.length>1?`<button class="chip" data-act="exDel" data-i="${i}" style="margin-top:6px">✕</button>`:""}</div>`).join("")}
 <button class="btn alt" data-act="exAdd">${t("exAdd")}</button><label class="fl">${t("exNote")}</label><textarea class="fi" id="exNo" rows="2">${v("#exNo")}</textarea>
 <label style="display:flex;gap:9px;margin-top:10px;align-items:flex-start"><input type="checkbox" id="exC" style="width:20px;height:20px;flex:none" ${exKeep.c?"checked":""}> ${t("exConsent")} *</label><div id="exErr" style="color:var(--red);font-weight:600;margin-top:6px"></div><button class="btn" data-act="exSend">${t("siSend")}</button>`)}

/* ============ START ============ */
loadOps();SPONSORS=P3.sponsors.filter(x=>x.status==="approved");buildDemos();go(recipCode()?"ticket":"news");renderBanner();noticeToasts();
window.addEventListener("hashchange",()=>{if(recipCode())go("ticket");else if(viewName==="ticket")R.ticket()});
window.addEventListener("storage",e=>{if(e.key==="psd_gate"&&viewName==="ticket"&&regStep===0)R.ticket();if(e.key==="psd_order"){ORDER=store.get("psd_order",ORDER);if(viewName==="ticket")R.ticket()}});
if(!lang)setTimeout(langSheet,250);else if(!accepted)setTimeout(()=>safetySheet(true),250);

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silage Day 2027 – Operations</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="shared.js"></script>
<style>
:root{--green:#2c4a1c;--green2:#3f6b25;--grass:#7fa83a;--light:#f1edd8;--paper:#fbf8ee;--brown:#3a2614;--cream:#f6efcf;--ink:#2a1e12;--muted:#6b6250;--line:#e2dcc4;--yellow:#f5c518;--red:#c8202a;--amber:#e08a00;--live:#19a34a;--blue:#2a6fb0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Barlow,system-ui,sans-serif;font-size:15px}
h1,h2,h3,.cond{font-family:"Barlow Condensed",Barlow,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:30;background:var(--cream);border-bottom:3px solid var(--brown);padding:8px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header img{height:46px}
header .t{line-height:1.1}
header .t b{font:800 18px "Barlow Condensed";color:var(--green);display:block}
header .t span{font-size:12px;color:var(--muted)}
.hctl{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rolesel{background:var(--yellow);border:0;border-radius:8px;padding:6px 10px;font-weight:700;color:var(--brown)}
.clock{display:flex;align-items:center;gap:6px;background:var(--green);color:var(--cream);border-radius:8px;padding:4px 10px;font-size:12px}
.clock b{font:700 17px "Barlow Condensed";min-width:40px}
.clock input{width:120px;accent-color:var(--yellow)}
.layout{display:flex;min-height:calc(100vh - 66px)}
nav{width:200px;flex:none;background:#fff;border-right:1px solid var(--line);padding:10px 0}
nav button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;padding:10px 16px;font-weight:600;color:var(--muted);font-size:14.5px}
nav button.on{background:var(--light);color:var(--green);box-shadow:inset 3px 0 0 var(--green)}
nav button .n{margin-left:auto;background:var(--red);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px}
nav .vlink{display:block;margin:14px 16px 0;font-size:13px;color:var(--green)}
main{flex:1;min-width:0;padding:16px 18px 90px}
@media (max-width:760px){
  .layout{display:block}
  nav{position:fixed;bottom:0;left:0;right:0;width:auto;z-index:30;display:flex;border-right:0;border-top:1px solid var(--line);padding:0;overflow-x:auto}
  nav button{flex:1;flex-direction:column;gap:2px;padding:8px 6px 10px;font-size:11px;text-align:center;min-width:70px}
  nav button.on{box-shadow:inset 0 3px 0 var(--green)}
  nav button .n{position:absolute;margin:0 0 0 22px}
  nav .vlink{display:none}
  main{padding:12px 12px 90px}
  header img{height:34px}
  header{position:static;padding:6px 10px}
  header .t span{display:none}
  .banner{font-size:11.5px;padding:5px 10px}
  .clock input{width:90px}
}
h2.pg{font-size:26px;margin:2px 0 4px;color:var(--brown)}
.sub{color:var(--muted);font-size:13.5px;margin-bottom:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:20px;color:var(--green)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stats div{background:var(--green);color:var(--cream);border-radius:12px;padding:10px 12px;font-size:12.5px}
.stats b{display:block;font:800 28px "Barlow Condensed";color:var(--yellow)}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.ok{background:#dcf5e3;color:#11713a}.wait{background:#fff0d6;color:#8a5300}.bad{background:#fde2e2;color:#a01919}.grey{background:#eee;color:#666}.info{background:#e3eefa;color:#1d5590}
.btn{border:0;border-radius:9px;background:var(--green);color:#fff;font-weight:700;padding:9px 14px}
.btn.alt{background:var(--light);color:var(--green)}
.btn.red{background:var(--red)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:7px}
.btn.y{background:var(--yellow);color:var(--brown)}
.btn:disabled{opacity:.4}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}.tbl th,.tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}.tbl th{font-size:12px;color:var(--muted)}
.appr{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}.appr .it{flex-wrap:wrap}.appr .it .b{flex:1 1 220px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.list .it{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.it .b{flex:1;min-width:0}
.it .b b{font-size:15px}
.small{font-size:12.5px;color:var(--muted)}
.code{font:700 12px ui-monospace,monospace;background:var(--light);border-radius:5px;padding:1px 5px;color:var(--brown)}
.fl{display:block;font-size:12.5px;font-weight:700;margin:10px 0 4px}
.fl i{color:var(--red);font-style:normal}
.fi{width:100%;border:1px solid #cfc7aa;border-radius:8px;padding:8px 10px;background:#fffdf6;font-size:15px}
.fi.badf{border-color:var(--red);background:#fff4f4}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.chk{display:flex;gap:9px;align-items:flex-start;margin:10px 0;font-size:14.5px}
.chk input{width:20px;height:20px;accent-color:var(--green);flex:none;margin-top:1px}
.iss{border-radius:8px;padding:7px 10px;margin:5px 0;font-size:13.5px}
.iss.e{background:#fde2e2;color:#8a1515}.iss.w{background:#fff4d6;color:#7a5200}
.iss a{color:inherit;font-weight:700;cursor:pointer;text-decoration:underline}
/* timetable grid */
.ttwrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff;max-height:70vh}
table.tt{border-collapse:separate;border-spacing:0;min-width:900px;width:100%;table-layout:fixed}
.tt col.tc{width:74px}
.tt th,.tt td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:5px;vertical-align:top}
.tt thead th{position:sticky;top:0;background:var(--cream);z-index:2;font:700 15px "Barlow Condensed";color:var(--brown)}
.tt tbody th{position:sticky;left:0;background:#fffdf6;z-index:1;font:700 14px "Barlow Condensed";color:var(--green);white-space:nowrap;width:70px}
.cell{display:block;width:100%;min-height:62px;text-align:left;border:1px dashed #d9d0b2;border-radius:8px;background:#fffdf6;padding:5px 6px;font-size:12px;color:var(--muted)}
.cell.f{border:1px solid #c9d8b8;background:#f4f9ee;color:var(--ink)}
.cell.e{border-color:var(--red);background:#fff1f1}
.cell.w{border-color:var(--amber);background:#fff9ea}
.cell b{display:block;font-size:12.5px;color:var(--green)}
.cell .tm{display:block;line-height:1.3}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,20,10,.45);z-index:50;display:none}
.modal{position:fixed;z-index:51;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,94vw);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:16px 18px;display:none}
.modal.on,.scrim.on{display:block}
.modal h2{margin:0 0 4px;font-size:24px}
.mclose{position:absolute;right:12px;top:10px;border:0;background:var(--light);width:32px;height:32px;border-radius:50%;font-size:18px}
.team{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0;background:#fffdf6}
.team .row select{flex:1;min-width:140px}
.toast{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:60;width:min(520px,94vw);background:var(--brown);color:var(--cream);border-radius:12px;padding:11px 14px;box-shadow:0 8px 24px rgba(0,0,0,.35);display:none;font-size:14px}
.toast.on{display:block}
.toast b{display:block;color:var(--yellow);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px}
.brief h4{margin:14px 0 4px;font:700 18px "Barlow Condensed";color:var(--green)}
.brief ul{margin:4px 0;padding-left:20px}.brief li{margin-bottom:4px}
.qopt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 12px;margin:6px 0}
.qopt.sel{border-color:var(--green);background:var(--light);font-weight:600}
.qopt.right{border-color:var(--live);background:#e6f7ec}.qopt.wrong{border-color:var(--red);background:#fdeaea}
.ckrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.ckrow span{flex:1}
.ckrow button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:4px 9px;font-size:12.5px;font-weight:700}
.ckrow button.p.on{background:var(--live);color:#fff;border-color:var(--live)}
.ckrow button.f.on{background:var(--red);color:#fff;border-color:var(--red)}
.ckrow button.n.on{background:#888;color:#fff;border-color:#888}
.ready{display:inline-flex;gap:4px;align-items:center;font-size:12px;margin-right:8px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.d-ok{background:var(--live)}.d-wait{background:var(--amber)}.d-bad{background:var(--red)}.d-grey{background:#bbb}
.banner{background:var(--yellow);color:var(--brown);padding:8px 14px;font-weight:600;font-size:13.5px}
.search{margin-bottom:10px}
details summary{cursor:pointer;font-weight:700}
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="Pembrokeshire Silage Day">
  <div class="t"><b>Operations app</b><span>Organisers · exhibitors · drivers · staff — prototype</span></div>
  <div class="hctl">
    <select class="rolesel" id="roleSel" aria-label="View as (prototype only)">
      <option value="admin">🛠️ Organiser</option>
      <option value="exhibitor">🚜 Exhibitor (sample)</option>
      <option value="driver">🧑‍🌾 Driver (sample)</option>
      <option value="scrut">🔧 Scrutineer</option>
      <option value="marshal">🦺 Field marshal</option>
      <option value="gate">💷 Gate cashier</option>
      <option value="sponsor">🤝 Sponsor (sample)</option>
      <option value="catering">🍔 Catering</option>
      <option value="staffm">🦺 Staff / volunteer</option>
    </select>
    <div class="clock">Event time <b id="clock">09:00</b><input type="range" id="slider" min="390" max="1050" step="5" value="540" aria-label="Simulated time on the day"></div>
  </div>
</header>
<div class="banner">Prototype: the “view as” picker and time slider are for testing only. In the live app each person signs in and sees only their own screens – organisers give access under People &amp; access.</div>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div class="scrim" id="scrim"></div>
<div class="modal" id="modal"><button class="mclose" data-act="closeModal" aria-label="Close">×</button><div id="mbody"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ UTILITIES ============ */
const $=s=>document.querySelector(s);
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=m=>m==null?"–":String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const parseTime=v=>{const m=String(v||"").trim().match(/^(\d{1,2})[:.]?(\d{2})/);if(!m)return null;const h=+m[1],mi=+m[2];return h>23||mi>59?null:h*60+mi};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const nowStamp=()=>{const d=new Date();return d.toLocaleDateString("en-GB")+" "+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})};
let toastT;function toast(t,m){const el=$("#toast");el.innerHTML=`<b>${esc(t)}</b>${esc(m)}`;el.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("on"),5000)}

/* ============ REFERENCE DATA ============ */
const FIELDS={6:"Field 6",7:"Field 7",8:"Field 8",9:"Field 9",10:"Field 10",11:"Field 11"};
const FIELD_IDS=[6,7,8,9,10,11];
// kind: power = tractor (pulls/carries implements) · self = self-propelled (one vehicle) · impl = needs a power unit
const BRIEFING_VERSION="Draft v0.1";
const BRIEF=[
 ["Before you drive",["You must be 18 or over and hold a licence for the vehicle you are driving.","Every machine must have passed scrutineering at the Machinery Check Point (4) before it enters a field.","Machines must be in the fields by 9:30am.","Zero tolerance for alcohol or drugs. Anyone unfit to drive will be stood down."]],
 ["In the demonstration fields",["Only start when the field marshal signals – the app will also tell you when your slot starts.","Stay inside your demo area. Members of the public are behind the rope line – if anyone crosses it, stop immediately and wait for a marshal.","No passengers in cabs or on any part of a machine, at any time.","No mobile phone use while driving."]],
 ["Moving between fields",["Drive at walking pace on lanes and anywhere near the public.","Follow marshals at crossing points. Machinery has right of way only when a marshal says so.","Load and unload away from the demonstration areas."]],
 ["Leaving a machine",["Never leave a machine with the engine running.","Unattended machines must be braked or chocked and immobilised at all times.","Remove keys when you leave the cab."]],
 ["Emergencies",["Stop, shut down and raise your hand to the nearest marshal.","First aid is at the Main Show Field (5).","For a serious incident call 999, then tell a marshal."]]
];
const QUIZ=[
 {q:"A member of the public walks under the rope line while you're working. What do you do?",o:["Sound the horn and carry on slowly","Stop immediately and wait for a marshal","Drive around them"],a:1,why:"Stop immediately and wait for a marshal to clear the area."},
 {q:"Can you carry a passenger in the cab during a demo?",o:["Yes, if they're over 18","Only between fields","No – never"],a:2,why:"No passengers are allowed in cabs or on any part of a machine, at any time."},
 {q:"When can you start your demonstration?",o:["When the field marshal signals","As soon as you arrive at the field","When the previous machine leaves"],a:0,why:"Only start when the field marshal gives the signal."},
 {q:"You need to leave your tractor for a few minutes. What must you do?",o:["Leave it idling so it's ready","Shut it down, brake or chock it and take the keys","Ask the public to keep clear"],a:1,why:"Never leave a machine running – brake or chock it, immobilise it and take the keys."},
 {q:"How fast should you drive on the lanes between fields?",o:["Walking pace","20 mph","As fast as is safe"],a:0,why:"Walking pace on lanes and anywhere near the public."}
];

/* ============ DATABASE ============ */
let db=store.get("psd_ops1",null);
if(!db||db.v!==1)db=seed();
const save=()=>store.set("psd_ops1",db);
const log=(cat,action,detail)=>{db.audit.unshift({ts:nowStamp(),ev:fmt(now),cat,action,detail:String(detail||""),by:ROLES[role].who});if(db.audit.length>800)db.audit.length=800;save()};

/* ============ STATE ============ */
let role=store.get("psd_ops_role","admin"),view=null,now=540;
const ME={sponsor:"SP-1",exhibitor:"EX-03",driver:"D-04",marshal:[8,9,10,11]};
const ROLES={
 admin:{who:"Organiser",nav:[["overview","📊","Overview"],["approvals","☑️","Needs approval"],["news","📣","News & alerts"],["entries","🚜","Entries"],["drivers","🧑‍🌾","Drivers"],["timetable","🗓️","Timetable"],["checks","✅","Checklists"],["mpages","📸","Machine pages"],["sponsors","🤝","Sponsors & vouchers"],["access","🔑","People & access"],["staff","🦺","Staff"],["sms","💬","Texts"],["audit","📜","Audit log"]]},
 exhibitor:{who:"Exhibitor – Sample Vintage Club",nav:[["myentry","🚜","My entry"],["myphotos","📸","Photos"],["myslots","🗓️","My slots"],["alerts","🔔","Alerts"]]},
 driver:{who:"Driver – Sample Driver 4",nav:[["briefing","📋","Safety briefing"],["myday","🗓️","My day"],["alerts","🔔","Alerts"]]},
 scrut:{who:"Scrutineer",nav:[["arrivals","🔧","Machines"],["sdrivers","🪪","Drivers & ID"]]},
 marshal:{who:"Field marshal – Fields 8–11",nav:[["fields","🦺","My fields"]]},
 gate:{who:"Gate cashier",nav:[["gatesales","💷","Gate sales"]]},
 sponsor:{who:"Sponsor – Gwili Jones",nav:[["spprofile","🤝","Profile"],["spoffers","🏷️","Offers"],["spvouchers","🍔","Meal vouchers"]]},
 catering:{who:"Catering",nav:[["vcheck","🍔","Voucher check"]]},
 staffm:{who:"Staff member",nav:[["myjob","🦺","My job"]]}
};

/* ============ LOOKUPS ============ */
const mach=id=>db.machines.find(m=>m.id===id);
const drv=id=>db.drivers.find(d=>d.id===id);
const exh=id=>db.exhibitors.find(e=>e.id===id);
const slotLen=()=>db.settings.len;
const sStart=s=>s.start+(s.delay||0), sEnd=s=>s.start+slotLen()+(s.delay||0);
const mLabel=m=>m?`${m.make} (${m.type})`:"–";
const memberMachines=t=>[t.power,...t.impls].filter(Boolean);
const slotGrid=()=>{const st=db.settings;return Array.from({length:st.count},(_,i)=>st.first+i*(st.len+st.gap))};
const checksFor=m=>db.checks[m.type]||db.checks["*"];
const scrutStatus=m=>m.scrut?m.scrut.status:"todo";
const driverReady=d=>!!(d&&d.briefing&&d.id18);
const SCR_PILL={todo:'<span class="pill grey">Not checked</span>',pass:'<span class="pill ok">Passed</span>',advisory:'<span class="pill info">Passed – advisory</span>',fail:'<span class="pill bad">Failed</span>'};
const ST_PILL={approved:'<span class="pill ok">Approved</span>',pending:'<span class="pill wait">Awaiting approval</span>',declined:'<span class="pill bad">Declined</span>'};

/* ============ VALIDATION ============ */
function slotIssues(){
 const out=[];const L=slotLen(),co=db.settings.changeover;
 const uses={machine:{},driver:{}};
 db.slots.forEach(s=>{
  const fld=`Field ${s.field} ${fmt(s.start)}`;
  if(!s.team.length)out.push({lvl:"w",slot:s.id,msg:`${fld}: "${s.demo}" has no team yet.`});
  s.team.forEach(t=>{
   const pm=mach(t.power);const im=t.impls.map(mach).filter(Boolean);
   if(!t.driver)out.push({lvl:"e",slot:s.id,msg:`${fld}: ${t.role||"team member"} has no driver.`});
   if(!pm&&!im.length)out.push({lvl:"e",slot:s.id,msg:`${fld}: ${t.role||"team member"} has no machine.`});
   if(pm&&pm.kind==="impl")out.push({lvl:"e",slot:s.id,msg:`${fld}: ${pm.make} is an implement and can't be the power unit.`});
   if(im.length&&!pm)out.push({lvl:"e",slot:s.id,msg:`${fld}: ${im[0].make} needs a tractor to pull or carry it.`});
   if(pm&&pm.kind==="self"&&im.length)out.push({lvl:"w",slot:s.id,msg:`${fld}: ${pm.make} is self-propelled – check the implement pairing.`});
   [pm,...im].filter(Boolean).forEach(m=>{
    (uses.machine[m.id]=uses.machine[m.id]||[]).push({s,t});
    if(m.status!=="approved")out.push({lvl:"w",slot:s.id,msg:`${fld}: ${m.make} (${m.id}) isn't approved yet.`});
    if(m.scrut&&m.scrut.status==="fail")out.push({lvl:"e",slot:s.id,msg:`${fld}: ${m.make} FAILED scrutineering.`});
   });
   if(t.driver){const d=drv(t.driver);(uses.driver[t.driver]=uses.driver[t.driver]||[]).push({s,t});
     if(d&&!d.declared18&&!d.id18)out.push({lvl:"w",slot:s.id,msg:`${fld}: ${d.name} hasn't been confirmed as 18+.`});}
  });
  const hasHarv=s.team.some(t=>memberMachines(t).map(mach).some(m=>m&&/forage harvester/i.test(m.type)));
  const hasTrailer=s.team.some(t=>memberMachines(t).map(mach).some(m=>m&&/trailer|wagon/i.test(m.type)));
  if(hasHarv&&!hasTrailer)out.push({lvl:"w",slot:s.id,msg:`${fld}: harvesting team has no trailer to fill.`});
 });
 const clash=(kind,id,list)=>{
  list.sort((a,b)=>sStart(a.s)-sStart(b.s));
  for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){
   const a=list[i],b=list[j];if(a.s.id===b.s.id&&kind==="driver"&&a.t!==b.t){out.push({lvl:"e",slot:a.s.id,msg:`${(drv(id)||{name:id}).name} is driving two machines in the same slot (Field ${a.s.field} ${fmt(a.s.start)}).`});continue}
   if(a.s.id===b.s.id)continue;
   const gap=a.s.field===b.s.field?0:co;
   if(sStart(b.s)<sEnd(a.s)+gap&&sStart(a.s)<sEnd(b.s)+gap){
     const name=kind==="machine"?`${(mach(id)||{make:id}).make} (${id})`:(drv(id)||{name:id}).name;
     const overlap=sStart(b.s)<sEnd(a.s)&&sStart(a.s)<sEnd(b.s);
     out.push({lvl:"e",slot:b.s.id,msg:overlap?`Clash: ${name} is in Field ${a.s.field} (${fmt(sStart(a.s))}) and Field ${b.s.field} (${fmt(sStart(b.s))}) at the same time.`:`Changeover too short: ${name} finishes in Field ${a.s.field} at ${fmt(sEnd(a.s))} and starts in Field ${b.s.field} at ${fmt(sStart(b.s))} (needs ${co} min).`});
   }
  }
 };
 Object.entries(uses.machine).forEach(([id,l])=>clash("machine",id,l));
 Object.entries(uses.driver).forEach(([id,l])=>clash("driver",id,l));
 const seen=new Set();return out.filter(x=>{const k=x.slot+x.msg;if(seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>a.lvl.localeCompare(b.lvl));
}

/* ============ ALERTS ============ */
function alertsFor({driverId,exId}){
 const out=[];
 db.slots.forEach(s=>s.team.forEach(t=>{
  const mine=driverId?t.driver===driverId:memberMachines(t).some(id=>{const m=mach(id);return m&&m.exId===exId});
  if(!mine)return;
  const ms=memberMachines(t).map(id=>mach(id)?.make).filter(Boolean).join(" + ");const st=sStart(s);const who=driverId?"":` (driver: ${drv(t.driver)?.name||"TBC"})`;
  if(s.state==="cancel"){out.push({at:now,msg:`Cancelled: ${s.demo} in Field ${s.field}. Please speak to the organisers.`,k:"bad"});return}
  out.push({at:st-30,msg:`${fmt(st)} – ${s.demo}, Field ${s.field}, ${t.role}: ${ms}${who}. Head to the field gate.`});
  out.push({at:st-10,msg:`Get ready – Field ${s.field} starts in 10 minutes with ${ms}.`});
  out.push({at:st,msg:`Start now – Field ${s.field}, ${s.demo}. Wait for the marshal's signal.`,k:"go"});
  if(s.delay)out.push({at:s.start-30,msg:`Delay: ${s.demo} in Field ${s.field} moved back ${s.delay} min to ${fmt(st)}.`,k:"bad"});
  db.calls.filter(c=>c.slot===s.id).forEach(c=>out.push({at:c.at,msg:`📣 Called by marshal: Field ${s.field}, ${t.role} (${ms}) – proceed now.`,k:"go"}));
 }));
 return out.sort((a,b)=>a.at-b.at);
}
let prevNow=now;
function checkToasts(){
 const me=role==="driver"?{driverId:ME.driver}:role==="exhibitor"?{exId:ME.exhibitor}:null;
 if(me){const a=alertsFor(me).filter(x=>x.at>prevNow&&x.at<=now).pop();if(a)toast(role==="driver"?"Driver alert":"Exhibitor alert",a.msg)}
 prevNow=now;
}

// Shrink a chosen photo so it fits comfortably in storage (the live version uploads to cloud storage instead)
function resizeImg(file,max){return new Promise((res,rej)=>{if(!file||!/^image\//.test(file.type))return rej("not an image");const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.8))};im.onerror=()=>rej("bad image");im.src=r.result};r.onerror=()=>rej("read failed");r.readAsDataURL(file)})}
const imgOk=s=>/^data:image\/(jpeg|png|webp);base64,/.test(s||"")||/^(news|sponsors)\/[\w.-]+$/.test(s||"");

/* ============ BACK-END ACCESS SHEET: import / export ============ */
const ROLE_FROM_TEXT=t=>{t=String(t||"").trim().toLowerCase();if(/^(organi[sz]er|admin)/.test(t))return"admin";if(/^scrut/.test(t))return"scrut";if(/marshal/.test(t))return"marshal";if(/gate|cashier/.test(t))return"gate";if(/cater/.test(t))return"catering";return null};
const parseFields=t=>{const out=new Set();String(t||"").split(/[,;/ ]+/).filter(Boolean).forEach(p=>{const m=p.match(/^(\d+)\s*[-–]\s*(\d+)$/);if(m){for(let i=+m[1];i<=+m[2];i++)out.add(i)}else if(/^\d+$/.test(p))out.add(+p);else out.add(NaN)});return[...out]};
const normC=c=>String(c||"").replace(/\s/g,"").toLowerCase();
let sheetRows=null,sheetText="";
function checkSheet(text){
 const lines=text.split(/\r?\n/).filter(l=>l.trim());if(!lines.length)return[];
 let rows=lines.map(l=>l.split("\t").map(x=>x.trim()));
 if(/name/i.test(rows[0][0]||"")&&/mobile|email|contact/i.test(rows[0][1]||""))rows=rows.slice(1); // skip header row
 const seen=new Set(),out=[];
 rows.forEach((r,i)=>{const [name,contact,roleT,fieldsT,statusT]=r;const o={n:i+1,name:name||"",contact:contact||"",roleT:roleT||"",fieldsT:fieldsT||"",remove:/^remove/i.test(statusT||""),errs:[],act:""};
  const role=ROLE_FROM_TEXT(roleT);o.role=role;const f=parseFields(fieldsT);o.fields=f.filter(x=>!isNaN(x));
  if(!o.name)o.errs.push("No name");
  if(!(isPhone(o.contact)||isEmail(o.contact)))o.errs.push("Mobile or email not valid");
  if(!role)o.errs.push(`Role “${o.roleT||"blank"}” not recognised`);
  if(role==="admin"&&!isEmail(o.contact))o.errs.push("Organisers need an email address");
  if(role==="marshal"&&!o.remove){if(f.some(x=>isNaN(x)||!FIELD_IDS.includes(x)))o.errs.push(`Fields must be from ${FIELD_IDS[0]}–${FIELD_IDS.at(-1)}`);else if(!o.fields.length)o.errs.push("Marshal needs fields")}
  if(role!=="marshal")o.fields=[];
  const k=normC(o.contact);if(k&&seen.has(k))o.errs.push("Same person twice in the sheet");seen.add(k);
  const ex=db.access.find(a=>normC(a.contact)===k);o.ex=ex?ex.id:null;
  if(!o.errs.length){
   if(o.remove)o.act=ex&&ex.status!=="removed"?"remove":"nothing";
   else if(!ex)o.act="new";
   else if(ex.status==="removed")o.act="restore";
   else if(ex.role!==role||ex.fields.join()!==o.fields.join()||ex.name!==o.name)o.act="change";
   else o.act="nothing"}
  out.push(o)});
 // last-organiser rule across the whole import
 const orgsAfter=db.access.filter(a=>a.role==="admin"&&a.status!=="removed").map(a=>a.id).filter(id=>!out.some(o=>!o.errs.length&&o.ex===id&&(o.act==="remove"||(o.act==="change"&&o.role!=="admin"))));
 const newOrgs=out.filter(o=>!o.errs.length&&o.role==="admin"&&(o.act==="new"||o.act==="restore")).length;
 if(orgsAfter.length+newOrgs===0)out.forEach(o=>{if(o.ex&&(o.act==="remove"||o.act==="change")&&db.access.find(a=>a.id===o.ex).role==="admin")o.errs.push("This would leave no organisers")});
 return out}
const ACT_LABEL={new:'<span class="pill info">New – invite</span>',change:'<span class="pill wait">Change role</span>',remove:'<span class="pill bad">Remove access</span>',restore:'<span class="pill info">Give access back</span>',nothing:'<span class="pill grey">No change</span>'};
function sheetCard(){
 const ok=sheetRows?sheetRows.filter(o=>!o.errs.length&&o.act!=="nothing"):[],bad=sheetRows?sheetRows.filter(o=>o.errs.length):[];
 return`<div class="card"><h3>🗂️ Back-end access sheet</h3><div class="small">A Google Sheet kept by the charity, outside the app. Use it to set up lots of roles at once, and to get back in if every organiser is ever removed. Columns: <b>Name · Mobile or email · Role · Fields · Status</b> (type “Remove” in Status to take access away). People not in the sheet are left as they are.</div>

 <label class="fl">Paste rows from the sheet</label><textarea class="fi" id="shIn" rows="5" placeholder="Select the rows in Google Sheets, copy, and paste here">${esc(sheetText)}</textarea>
 <button class="btn sm" data-act="shCheck" style="margin-top:8px">Check rows</button>
 ${sheetRows?`<div style="margin-top:12px"><b>${sheetRows.length}</b> row(s): <span class="pill ok">${ok.length} to apply</span> <span class="pill ${bad.length?"bad":"grey"}">${bad.length} with problems</span> <span class="pill grey">${sheetRows.length-ok.length-bad.length} no change</span></div>
 <table class="tbl" style="margin-top:8px"><tr><th>Row</th><th>Name</th><th>Contact</th><th>Role</th><th>Result</th></tr>${sheetRows.map(o=>`<tr><td>${o.n}</td><td>${esc(o.name)}</td><td>${esc(o.contact)}</td><td>${o.role?ACCESS_ROLES[o.role]:esc(o.roleT)}${o.fields.length?" · "+o.fields.join(", "):""}</td><td>${o.errs.length?`<span class="pill bad">${o.errs.map(esc).join(" · ")}</span>`:ACT_LABEL[o.act]}</td></tr>`).join("")}</table>
 ${ok.length?`<button class="btn" data-act="shApply" style="margin-top:10px">Apply ${ok.length} change(s)${ok.some(o=>o.act==="new"||o.act==="restore")?" and send invitations":""}</button>`:""}${bad.length?'<div class="small" style="margin-top:6px">Rows with problems are skipped – fix them in the sheet and paste again.</div>':""}`:""}</div>`}
const shDate=()=>new Date().toLocaleString("en-GB",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
Object.assign(ACT,{
 shCopy:async el=>{try{await navigator.clipboard.writeText(tsv([["Name","Mobile or email","Role","Fields","Status","ID","Last changed"],...db.access.map(a=>[a.name,a.contact,ACCESS_ROLES[a.role],a.fields.join(", "),a.status==="removed"?"Removed":a.status==="active"?"Signed in":"Invited",a.id,a.changed||a.at||""])]));el.textContent="Copied ✓ – paste into the sheet";log("Access","Access list copied to sheet",`${db.access.length} rows`)}catch(e){el.textContent="Couldn't copy"}},

     if(isPhone(a.contact))sendSms(a.name,a.contact,`Hi ${a.name.split(" ")[0]}, you've been given ${ACCESS_ROLES[a.role]} access to the Pembrokeshire Silage Day operations app. Sign in: [link] code ${a.code}`,"Access invite");
     log("Access","Access given (from sheet)",`${a.id} · ${a.name} · ${ACCESS_ROLES[a.role]}${a.fields.length?" · Fields "+a.fields.join(", "):""}`)}
   else{const a=db.access.find(x=>x.id===o.ex);
    if(o.act==="remove"){a.status="removed";a.removedAt=dstampNow();a.code=null;log("Access","Access removed (from sheet)",`${a.id} · ${a.name} · ${ACCESS_ROLES[a.role]}`)}
    else if(o.act==="restore"){Object.assign(a,{name:o.name,role:o.role,fields:o.fields,status:"invited",code:newCode()});if(isPhone(a.contact))sendSms(a.name,a.contact,`You've been given ${ACCESS_ROLES[a.role]} access to the Pembrokeshire Silage Day operations app. Sign in: [link] code ${a.code}`,"Access invite");log("Access","Access given back (from sheet)",`${a.id} · ${a.name} · ${ACCESS_ROLES[a.role]}`)}
    else{const before=`${ACCESS_ROLES[a.role]}${a.fields.length?" (Fields "+a.fields.join(", ")+")":""}`;Object.assign(a,{name:o.name,role:o.role,fields:o.fields});log("Access","Role changed (from sheet)",`${a.id} · ${a.name} · ${before} → ${ACCESS_ROLES[a.role]}${a.fields.length?" (Fields "+a.fields.join(", ")+")":""}`)}
    a.changed=stamp}n++});
  save();sheetRows=null;sheetText="";render();toast("Sheet applied",`${n} change(s) made. Copy the access list back to the sheet to keep it up to date.`)}
});
// put the sheet card at the top of People & access
{const base=VIEWS.access;VIEWS.access=()=>{const h=base();const i=h.indexOf('<div class="grid2">');return h.slice(0,i)+sheetCard()+h.slice(i)}}
